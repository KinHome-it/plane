worker_processes 4;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  default_type  application/octet-stream;

  set_real_ip_from        0.0.0.0/0;
  real_ip_recursive       on;
  real_ip_header          X-Forwarded-For;
  limit_req_zone          $binary_remote_addr zone=mylimit:10m rate=10r/s;

  access_log /dev/stdout;
  error_log /dev/stderr;

  server {
    listen 3000;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Same-origin proxy for the API (2026-10-09, t_aad4f7): web and api are different sites under up.railway.app
    # (public suffix), so the api's session cookie was a third-party cookie and Safari dropped it. Proxying /api/ and
    # /auth/ through this host makes the cookie first-party. Railway private networking is IPv6-only: resolver is
    # Railway's fd12::10 (8.8.8.8 cannot resolve *.railway.internal) and the api binds [::] (docker-entrypoint-api.sh).
    location ~ ^/(api|auth)/ {
      resolver [fd12::10] valid=30s;
      set $api_upstream http://api.railway.internal:8000;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 300s;
      client_max_body_size 50m;
    }

    location / {
      root   /usr/share/nginx/html;
      index  index.html index.htm;
      try_files $uri $uri/ /god-mode/index.html;
    }
  }
}